  # ===========================================
  # SUPERVISOR AGENT
  # ===========================================

  supervisor-agent:
    build:
      context: src/orchestrator/supervisor_agent
      dockerfile: Dockerfile
    container_name: supervisor-agent
    ports:
      - "9004:9004"
    environment:
      # Using gpt-oss-120b:free instead of gpt-4o-mini
      - SUPERVISOR_LLM=${SUPERVISOR_LLM:-openrouter/openai/gpt-4o-mini}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SLIM_ENDPOINT=${SLIM_ENDPOINT:-http://3.7.70.176:46357}
      - DEFAULT_MESSAGE_TRANSPORT=SLIM
      # Disable OpenTelemetry completely to avoid connection errors
      - OTEL_SDK_DISABLED=true
      # - OTLP_HTTP_ENDPOINT=http://otel-collector:4318
      - DATABASE_URL=${DATABASE_URL:-postgresql://orchestrator_supervisor_agent:pFaiA88gRFFwrF@prayog-orchestrator-sandbox.c7geye6morpj.ap-south-1.rds.amazonaws.com:5432/orchestrator_supervisor_prod}
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI}
      # depends_on:
      #   - slim
      # - otel-collector
    networks:
      - orchestrator-net
  # ===========================================
  # WORKER AGENTS
  # ===========================================

  transaction-rca-agent:
    build:
      context: src/orchestrator/transaction_rca_agent
      dockerfile: Dockerfile
    container_name: transaction-rca-agent
    ports:
      - "${TRANSACTION_RCA_AGENT_PORT:-9006}:9006"
    environment:
      - TRANSACTION_RCA_AGENT_LLM=${TRANSACTION_RCA_AGENT_LLM:-openrouter/openai/gpt-5.2}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-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}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SLIM_ENDPOINT=${SLIM_ENDPOINT:-http://3.7.70.176:46357}
      - DEFAULT_MESSAGE_TRANSPORT=SLIM
    command: [ "sh", "-c", "PYTHONPATH=/app /app/.venv/bin/python -m app.main dual" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - orchestrator-net

  # SLIM commented out - using remote EC2 instance
  # To use local SLIM, uncomment this and update .env: SLIM_ENDPOINT=http://3.7.70.176:46357
  # slim:
  #   image: ghcr.io/agntcy/slim:0.6.1
  #   container_name: orchestrator-slim
  #   command: [ "/slim", "--config", "/etc/slim.yaml" ]
  #   ports:
  #     - "46357:46357"
  #     - "46358:46358"
  #   volumes:
  #     - ./config/slim/slim.yaml:/etc/slim.yaml:ro
  #   networks:
  #     - orchestrator-net
  # ===========================================
  # FRONTEND UI
  # ===========================================

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        - VITE_ORCHESTRATOR_API_URL=${VITE_ORCHESTRATOR_API_URL:-http://localhost:9004}
    container_name: orchestrator-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - supervisor-agent
    networks:
      - orchestrator-net

networks:
  orchestrator-net:
    driver: bridge

volumes:
  postgres_data:
