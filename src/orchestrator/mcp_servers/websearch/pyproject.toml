[project]
name = "websearch-mcp-server"
version = "0.1.0"
description = "Web Search MCP Server using fastmcp - vendor-agnostic search provider"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
